<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון ROI לאוטומציית בדיקות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Rubik', sans-serif; }
        /* Hide scrollbar for inputs */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" x-data="roiCalculator">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-blue-900 mb-3">מחשבון ROI לאוטומציית בדיקות 🤖</h1>
            <p class="text-lg text-slate-600">כלי לקבלת החלטות - האם ומתי כדאי להפוך בדיקה ידנית לאוטומטית</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-right">
                    <thead class="bg-slate-800 text-white font-medium">
                        <tr>
                            <th class="px-4 py-4 w-1/4">שם הבדיקה / תיאור</th>
                            <th class="px-4 py-4">זמן ידני<br><span class="text-xs font-normal text-slate-300">(דקות להרצה)</span></th>
                            <th class="px-4 py-4">תדירות<br><span class="text-xs font-normal text-slate-300">(בחודש)</span></th>
                            <th class="px-4 py-4">פיתוח אוטו'<br><span class="text-xs font-normal text-slate-300">(שעות)</span></th>
                            <th class="px-4 py-4">תחזוקה<br><span class="text-xs font-normal text-slate-300">(שעות בחודש)</span></th>
                            <th class="px-4 py-4 bg-blue-900">זמן חודשי נחסך<br><span class="text-xs font-normal text-slate-300">(שעות נטו)</span></th>
                            <th class="px-4 py-4 bg-blue-900">חודשים לאיזון<br><span class="text-xs font-normal text-slate-300">(ROI)</span></th>
                            <th class="px-4 py-4 bg-blue-900">המלצה סופית</th>
                            <th class="px-4 py-4"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                        <template x-for="(test, index) in tests" :key="index">
                            <tr class="hover:bg-slate-50 transition-colors">
                                <td class="px-4 py-3">
                                    <input type="text" x-model="test.name" class="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                </td>
                                <td class="px-4 py-3">
                                    <input type="number" x-model.number="test.manualMins" class="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 text-center">
                                </td>
                                <td class="px-4 py-3">
                                    <input type="number" x-model.number="test.freq" class="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 text-center">
                                </td>
                                <td class="px-4 py-3">
                                    <input type="number" x-model.number="test.devHours" class="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 text-center">
                                </td>
                                <td class="px-4 py-3">
                                    <input type="number" x-model.number="test.maintHours" class="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 text-center">
                                </td>
                                <td class="px-4 py-3 text-center font-bold text-slate-700" x-text="calcNetSavings(test) + ' שעות'"></td>
                                <td class="px-4 py-3 text-center font-bold" :class="getROIClass(test)" x-text="calcROI(test)"></td>
                                <td class="px-4 py-3 text-center">
                                    <span class="px-3 py-1 rounded-full text-xs font-bold" :class="getRecommendation(test).class" x-text="getRecommendation(test).text"></span>
                                </td>
                                <td class="px-4 py-3 text-center">
                                    <button @click="removeRow(index)" class="text-red-400 hover:text-red-600 transition-colors" title="מחק שורה">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            
            <div class="bg-slate-100 p-6 flex items-center justify-between border-t border-slate-200">
                <button @click="addRow()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-md flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                    הוסף בדיקה חדשה
                </button>
                <div class="text-xl font-bold text-slate-800">
                    סה"כ חיסכון חודשי משוער בצוות: 
                    <span class="text-blue-600 text-3xl ml-2" x-text="totalSavings"></span> 
                    <span class="text-lg text-slate-500">שעות</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('roiCalculator', () => ({
                // טעינת הנתונים מה-CSV המקורי
                tests: [
                    { name: "בדיקת רגרסיה ראשית (רצה בכל Build)", manualMins: 10, freq: 90, devHours: 2, maintHours: 0.5 },
                    { name: "בדיקת עשן (Smoke Test על כל PR)", manualMins: 5, freq: 60, devHours: 4, maintHours: 0.2 },
                    { name: "בדיקת דפדפנים מרובים (Multi-browser)", manualMins: 20, freq: 30, devHours: 6, maintHours: 1 },
                    { name: "פיצ'ר חדש עם UI לא יציב (משתנה כל ספרינט)", manualMins: 15, freq: 8, devHours: 12, maintHours: 5 },
                    { name: "בדיקה חקירתית חד-פעמית (Exploratory)", manualMins: 45, freq: 1, devHours: 20, maintHours: 2 },
                    { name: "בדיקה מונעת-נתונים (Data-Driven Test)", manualMins: 30, freq: 25, devHours: 5, maintHours: 0.5 }
                ],
                calcManualMonthly(test) {
                    return ((test.manualMins * test.freq) / 60);
                },
                calcNetSavings(test) {
                    return (this.calcManualMonthly(test) - test.maintHours).toFixed(1);
                },
                calcROI(test) {
                    const savings = parseFloat(this.calcNetSavings(test));
                    if (savings <= 0) return '∞';
                    return (test.devHours / savings).toFixed(1);
                },
                getROIClass(test) {
                    const roi = parseFloat(this.calcROI(test));
                    if (isNaN(roi)) return 'text-red-500';
                    if (roi <= 3) return 'text-green-600';
                    if (roi <= 6) return 'text-yellow-600';
                    return 'text-red-500';
                },
                getRecommendation(test) {
                    const savings = parseFloat(this.calcNetSavings(test));
                    if (savings <= 0) return { text: 'לא מומלץ ❌', class: 'text-red-700 bg-red-100' };
                    
                    const roi = test.devHours / savings;
                    if (roi <= 3) return { text: 'מומלץ בחום 🔥', class: 'text-green-700 bg-green-100' };
                    if (roi <= 6) return { text: 'כדאי לשקול 🤔', class: 'text-yellow-700 bg-yellow-100' };
                    
                    return { text: 'עדיפות נמוכה ⏳', class: 'text-slate-700 bg-slate-200' };
                },
                get totalSavings() {
                    return this.tests.reduce((sum, test) => {
                        const savings = parseFloat(this.calcNetSavings(test));
                        return sum + (savings > 0 ? savings : 0);
                    }, 0).toFixed(1);
                },
                addRow() {
                    this.tests.push({ name: "", manualMins: 0, freq: 0, devHours: 0, maintHours: 0 });
                },
                removeRow(index) {
                    this.tests.splice(index, 1);
                }
            }));
        });
    </script>
</body>
</html>
